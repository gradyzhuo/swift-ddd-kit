# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift-build-testing
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    name: Swift ${{ matrix.swift }} on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        swift: ["6.1", "6.2", "6.3", "6.4"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}
      - run: ulimit -n 10000
      - name: Build
        run: swift build --build-tests --enable-code-coverage
      - name: Swift Testing
        run: swift test -v --skip-build --no-parallel --disable-xctest --enable-swift-testing --filter '(DDDKitUnitTests|EventSourcingTests|ContextForwarderTests|ContextReceiverTests|ContextReceiverWebSocketTests|TemplateVariablesTests|TemplateVariablesDefinitionTests|TemplateVariablesDemoTests|KurrentSupportInMemoryTests|ReadModelPersistenceTests|DomainEventGeneratorTests|ProjectorGeneratorFixtureTests|EventStoreContractTests|LocalEventStoreTests)'
      - uses: sersoft-gmbh/swift-coverage-action@v4
        id: coverage-files
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ join(fromJSON(steps.coverage-files.outputs.files), ',') }}

  build-linux-distros:
    name: Build on ${{ matrix.image }}
    strategy:
      matrix:
        image:
          - "swift:6.2-amazonlinux2"
          - "swift:6.2-bookworm"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and Test
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ matrix.image }} \
            bash -c "swift build --build-tests && swift test -v --no-parallel --disable-xctest --enable-swift-testing --filter '(DDDKitUnitTests|EventSourcingTests|ContextForwarderTests|ContextReceiverTests|ContextReceiverWebSocketTests|TemplateVariablesTests|TemplateVariablesDefinitionTests|TemplateVariablesDemoTests|KurrentSupportInMemoryTests|ReadModelPersistenceTests|DomainEventGeneratorTests|ProjectorGeneratorFixtureTests|EventStoreContractTests|LocalEventStoreTests)'"

  build-ios:
    name: Build for iOS
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: xcodebuild -resolvePackageDependencies
      - name: Build products for iOS Simulator
        run: |
          for product in DDDCore EventSourcing LocalEventStore; do
            xcodebuild build -scheme "$product" -destination 'generic/platform=iOS Simulator'
          done

  kurrent-live-contract:
    name: Kurrent live contract
    runs-on: ubuntu-24.04
    env:
      KURRENTDB_POOL_URLS: '["esdb://admin:changeit@localhost:2113?tls=false"]'
    steps:
      - uses: actions/checkout@v4
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.4"
      # Reference server for the EventStore contract; when bumping it, rerun this job and review (spec C §3, 1.4.0 changelog).
      - name: Start KurrentDB
        run: docker run -d --name kurrentdb -p 2113:2113 -e KURRENTDB_CLUSTER_SIZE=1 -e KURRENTDB_INSECURE=true kurrentplatform/kurrentdb:26.1.3
      - name: Wait for KurrentDB
        run: for i in $(seq 1 60); do curl -fsS http://localhost:2113/health/live && exit 0; sleep 1; done; echo "KurrentDB not live after 60s"; docker logs kurrentdb; exit 1
      - name: Live contract tests
        run: swift test --filter KurrentLiveContractTests
